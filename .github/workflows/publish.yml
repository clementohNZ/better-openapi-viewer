name: Publish packages to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish with
        required: false
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish workspaces
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify package contents
        run: pnpm run pack:check

      - name: Publish packages
        env:
          DIST_TAG: ${{ github.event.inputs.tag || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm publish --filter @clementoh/better-openapi-viewer-core --access public --provenance --tag "$DIST_TAG" --no-git-checks
          pnpm publish --filter @clementoh/better-openapi-viewer-ui --access public --provenance --tag "$DIST_TAG" --no-git-checks
          pnpm publish --filter @clementoh/better-openapi-viewer-nestjs --access public --provenance --tag "$DIST_TAG" --no-git-checks
